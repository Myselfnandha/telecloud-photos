name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        working-directory: ./telecloud_photos
        run: |
          flutter --version
          java -version

      - name: Install Flutter Dependencies
        working-directory: ./telecloud_photos
        run: flutter pub get

      - name: Run Static Code Analysis
        working-directory: ./telecloud_photos
        run: flutter analyze

      - name: Install Linux Test Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Run Unit & Integration Tests
        working-directory: ./telecloud_photos
        run: flutter test --concurrency=4

      - name: Build Universal Release APK
        working-directory: ./telecloud_photos
        run: flutter build apk --release

      - name: Build ABI-Split Release APKs (arm64, arm32, x86_64)
        working-directory: ./telecloud_photos
        run: flutter build apk --release --split-per-abi

      - name: Prepare & Rename Release Binaries
        id: prepare_apks
        run: |
          mkdir -p release_binaries
          
          # Determine Version Tag
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="v1.0.0-build.${{ github.run_number }}"
          fi
          
          # Universal Release APK
          cp telecloud_photos/build/app/outputs/flutter-apk/app-release.apk release_binaries/TeleCloud-Photos-${VERSION}.apk
          
          # ABI-specific APKs
          if [ -f "telecloud_photos/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp telecloud_photos/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_binaries/TeleCloud-Photos-${VERSION}-arm64-v8a.apk
          fi
          if [ -f "telecloud_photos/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp telecloud_photos/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_binaries/TeleCloud-Photos-${VERSION}-armeabi-v7a.apk
          fi
          if [ -f "telecloud_photos/build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp telecloud_photos/build/app/outputs/flutter-apk/app-x86_64-release.apk release_binaries/TeleCloud-Photos-${VERSION}-x86_64.apk
          fi

          echo "VERSION_TAG=${VERSION}" >> $GITHUB_OUTPUT
          ls -lh release_binaries/

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apks.outputs.VERSION_TAG }}
          name: "TeleCloud Photos ${{ steps.prepare_apks.outputs.VERSION_TAG }}"
          body: |
            ## 🌌 TeleCloud Photos ${{ steps.prepare_apks.outputs.VERSION_TAG }}
            
            ### ✨ What's New in this Release:
            - **📸 High-Performance Timeline**: Silky-smooth two-finger pinch-to-zoom density scaling (1–6 columns) with locked 120Hz refresh rate.
            - **🎨 iOS & Modern Adaptive Icon**: Full-bleed glassmorphism squircle app icon without white circle borders.
            - **📁 Monitored Backup Folders**: Live folder scanning (<50ms), status indicators, and dedicated "Manual Folder Upload" trigger.
            - **⚙️ Hierarchical Settings**: Compact 5-category master dashboard with dedicated sub-screens for Appearance, Cloud Migration, Backup Rules, Power Policies, and Storage Maintenance.
            - **🎯 Strict Media Classification**: Enhanced detection for Live Photos (`MVIMG_`, motion photos) and ultra-wide Panoramas (aspect ratio ≥ 2.4:1).
            - **🔄 Authentic Google Photos Sync**: Bit-for-bit original resolution cloud migration directly from Google OAuth2 endpoints.
            - **🏷️ Supergroup Topic Management**: Real-time forum channel synchronization with fallback naming for root storage folders.
            
            ---
            ### 📦 Download Assets:
            - **`TeleCloud-Photos-${{ steps.prepare_apks.outputs.VERSION_TAG }}.apk`** (Universal — Recommended for all Android devices)
            - **`TeleCloud-Photos-${{ steps.prepare_apks.outputs.VERSION_TAG }}-arm64-v8a.apk`** (Optimized for modern 64-bit phones)
          files: release_binaries/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
