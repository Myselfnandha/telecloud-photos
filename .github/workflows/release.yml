name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ============================================================================
  # Fast Pre-Flight Quality Gate (Analyzes and tests before compiling APKs)
  # ============================================================================
  quality-check:
    name: Lint & Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('telecloud_photos/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Dependencies
        working-directory: ./telecloud_photos
        run: flutter pub get

      - name: Run Static Code Analysis
        working-directory: ./telecloud_photos
        run: flutter analyze

      - name: Install Linux Test Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Run Tests
        working-directory: ./telecloud_photos
        run: flutter test --concurrency=4

  # ============================================================================
  # High-Speed Parallel Build Matrix (Universal & ABI-Split APKs build concurrently)
  # ============================================================================
  build-apk:
    name: Build (${{ matrix.target_name }})
    needs: quality-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: 'Universal APK'
            build_flag: '--release'
            artifact_key: 'universal'
          - target_name: 'ABI-Split APKs'
            build_flag: '--release --split-per-abi'
            artifact_key: 'split'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache Engine
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('telecloud_photos/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Flutter Dependencies
        working-directory: ./telecloud_photos
        run: flutter pub get

      - name: Compile ${{ matrix.target_name }}
        working-directory: ./telecloud_photos
        run: |
          flutter build apk ${{ matrix.build_flag }}

      - name: Stage Artifacts
        run: |
          mkdir -p staging_apks
          find telecloud_photos/build/app/outputs/flutter-apk/ -type f -name "*.apk" -exec cp {} staging_apks/ \;
          ls -lh staging_apks/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.artifact_key }}
          path: staging_apks/*.apk
          retention-days: 7

  # ============================================================================
  # Release Publisher (Collects parallel outputs & creates GitHub Release)
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Universal APK
        uses: actions/download-artifact@v4
        with:
          name: apks-universal
          path: release_binaries

      - name: Download Split APKs
        uses: actions/download-artifact@v4
        with:
          name: apks-split
          path: release_binaries

      - name: Process & Standardize Release Binaries
        id: prepare_release
        run: |
          # Determine Version Tag
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="v1.0.0-build.${{ github.run_number }}"
          fi

          cd release_binaries

          # Rename universal APK
          if [ -f "app-release.apk" ]; then
            mv app-release.apk TeleCloud-Photos-${VERSION}-universal.apk
          fi

          # Rename ABI split APKs
          if [ -f "app-arm64-v8a-release.apk" ]; then
            mv app-arm64-v8a-release.apk TeleCloud-Photos-${VERSION}-arm64-v8a.apk
          fi
          if [ -f "app-armeabi-v7a-release.apk" ]; then
            mv app-armeabi-v7a-release.apk TeleCloud-Photos-${VERSION}-armeabi-v7a.apk
          fi
          if [ -f "app-x86_64-release.apk" ]; then
            mv app-x86_64-release.apk TeleCloud-Photos-${VERSION}-x86_64.apk
          fi

          # Generate SHA-256 Checksums
          sha256sum *.apk > SHA256SUMS.txt

          echo "VERSION_TAG=${VERSION}" >> $GITHUB_OUTPUT
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_release.outputs.VERSION_TAG }}
          name: "TeleCloud Photos ${{ steps.prepare_release.outputs.VERSION_TAG }}"
          body: |
            ## 🌌 TeleCloud Photos ${{ steps.prepare_release.outputs.VERSION_TAG }}

            ### 🚀 High-Speed CI/CD Build Improvements:
            - **⚡ Parallel Matrix Compilation**: Universal and ABI-split APKs compiled concurrently in separate runners.
            - **📦 Advanced Gradle Caching**: Native Gradle build-cache and Pub package caching enabled for ultra-fast CI turnaround.
            - **🛡️ Strict Quality Gate**: Pre-flight test and static analysis gate before compiling binaries.

            ### ✨ Features Included:
            - **🔒 Strict Telegram Authentication**: Enforced Telegram API ID & Hash Key setup + Phone OTP verification before timeline access.
            - **⚙️ 3 Backup Policy Presets**: Intelligent Smart Mode, Conservative Battery Saver, and Instant Real-Time mode in Settings.
            - **🎨 Material 3 Expressive UI**: Complete 10-screen design system with wavy progress indicators, pill buttons, and connected cards.
            - **📁 Forum Topic Mirroring**: Direct folder-to-topic mapping in private Supergroups.
            - **🔄 Zero-Staging Google Takeout**: Memory-streamed Google Photos archives with JSON EXIF restoration.

            ---
            ### 📦 Download Assets & Checksums:
            - **`TeleCloud-Photos-${{ steps.prepare_release.outputs.VERSION_TAG }}-arm64-v8a.apk`** (Recommended for all modern 64-bit phones)
            - **`TeleCloud-Photos-${{ steps.prepare_release.outputs.VERSION_TAG }}-universal.apk`** (Compatible with all Android devices)
            - **`SHA256SUMS.txt`** (Cryptographic verification checksums)
          files: |
            release_binaries/*.apk
            release_binaries/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
