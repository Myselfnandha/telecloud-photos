name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Accelerator
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Patch Legacy Plugin Manifests (AGP 8+ compatibility)
        run: |
          find ~/.pub-cache -name "AndroidManifest.xml" -exec sed -i -E 's/package="[^"]*"//g' {} + || true

      - name: Run Static Code Analysis
        run: flutter analyze

      - name: Run Unit & Integration Tests
        run: flutter test --concurrency=4

      - name: Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Prepare & Rename Release Binary
        id: prepare_apks
        run: |
          mkdir -p release_binaries
          
          # Determine Version Tag (Auto-increment with run_number)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          elif [ -n "${{ github.event.inputs.version_tag }}" ]; then
            VERSION="${{ github.event.inputs.version_tag }}"
          else
            VERSION="v1.0.${{ github.run_number }}"
          fi
          
          # Copy Universal Release APK
          cp build/app/outputs/flutter-apk/app-release.apk release_binaries/TeleCloud-Photos-${VERSION}.apk

          echo "VERSION_TAG=${VERSION}" >> $GITHUB_OUTPUT
          ls -lh release_binaries/

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apks.outputs.VERSION_TAG }}
          name: "TeleCloud Photos ${{ steps.prepare_apks.outputs.VERSION_TAG }}"
          body: |
            ## 🌌 TeleCloud Photos ${{ steps.prepare_apks.outputs.VERSION_TAG }}
            
            ### ✨ What's New in this Release:
            - **📸 High-Performance Timeline**: Silky-smooth two-finger pinch-to-zoom density scaling (1–6 columns) with locked 120Hz refresh rate.
            - **🚀 Fast Auto-Login Flow**: Instant 1.2s branding animation with 2.5s hard timeout guarantee so the app never freezes on startup.
            - **💬 Reliable Telegram Code Delivery**: Real-time authorization state listeners for seamless verification code dispatch.
            - **🎨 iOS & Modern Adaptive Icon**: Full-bleed glassmorphism squircle app icon without white circle borders.
            - **📁 Monitored Backup Folders**: Live folder scanning (<50ms), status indicators, and dedicated "Manual Folder Upload" trigger.
            - **⚙️ Hierarchical Settings**: Compact 5-category master dashboard with dedicated sub-screens for Appearance, Cloud Migration, Backup Rules, Power Policies, and Storage Maintenance.
            - **🎯 Strict Media Classification**: Enhanced detection for Live Photos (`MVIMG_`, motion photos) and ultra-wide Panoramas (aspect ratio ≥ 2.4:1).
            - **🔄 Authentic Google Photos Sync**: Bit-for-bit original resolution cloud migration directly from Google OAuth2 endpoints.
            - **🏷️ Supergroup Topic Management**: Real-time forum channel synchronization with fallback naming for root storage folders.
            
            ---
            ### 📦 Download Asset:
            - **`TeleCloud-Photos-${{ steps.prepare_apks.outputs.VERSION_TAG }}.apk`** (Universal APK — Works on all Android devices)
          files: release_binaries/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
